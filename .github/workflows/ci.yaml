name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check workflow supply-chain hygiene
        run: scripts/ci/check-workflow-hygiene.sh
      - name: Check language hygiene
        run: scripts/ci/check-language-hygiene.sh
      - name: Check file-size hygiene
        run: scripts/ci/check-file-size.sh
      - name: Check release metadata
        run: scripts/ci/check-release-metadata.sh
      - name: Install GoReleaser for configuration validation
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true
      - name: Validate GoReleaser configuration
        run: goreleaser check
      - name: Test Homebrew Formula updater
        run: ruby scripts/release/update-homebrew-formula_test.rb
      # These were written as merge guards and wired only into the local
      # `make repo-hygiene`, which no workflow invokes -- so they gated nothing
      # on the merge path while both PRs described them as CI-enforced
      # (trvl#531 and trvl#539, 2026-08-06). Both are sabotage-verified; that
      # verified they WORK, never that they RUN. A guard that does not run is
      # not a weak guard, it is a comment.
      # Listed individually rather than via `make` so that adding a script to the
      # Makefile can never again silently mean "and it runs in CI".
      #
      # Log-URL redaction is deliberately NOT a step here. It began as a shell
      # script that matched a slog call and its fields on one line, so multi-line
      # calls were invisible to it and it reported clean against a live leak.
      # That job belongs to internal/logredact's slogguard test, which parses Go
      # syntax and therefore cannot have that blind spot -- and which, being a Go
      # test, already runs in CI without needing a step here at all.
      - name: Check home-directory isolation
        run: scripts/ci/check-home-isolation.sh
      - name: Check test-only helpers stay out of production
        run: scripts/ci/check-test-only-helpers.sh

  test:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26.6"]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # Pin lint/vuln tool versions instead of @latest: every GitHub Action in
      # this workflow is SHA-pinned, so an unpinned `go install ...@latest` was
      # the one remaining non-reproducible, supply-chain-exposed step — a new
      # upstream release could silently change findings or pull a compromised
      # version into CI. These pins match the latest release at time of writing;
      # bump them deliberately (Dependabot tracks the Go modules separately).
      - name: Install staticcheck
        if: runner.os != 'Windows'
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
      - name: Staticcheck
        if: runner.os != 'Windows'
        run: staticcheck ./...
      - name: Install golangci-lint
        if: runner.os != 'Windows'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: Golangci-lint
        if: runner.os != 'Windows'
        run: golangci-lint run ./...
      - name: Install govulncheck
        if: runner.os != 'Windows'
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
      - name: Vulnerability check
        if: runner.os != 'Windows'
        run: govulncheck ./...
      - name: Test
        if: runner.os != 'Windows'
        run: go test -p=1 -race -timeout=10m -coverprofile coverage.out ./...
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: go test -short -p=1 -race -timeout=10m -coverprofile coverage.out ./...
      - name: Watch test timing
        run: go test -short -count=1 -timeout=2m -json ./internal/watch | go run ./scripts/ci/summarize-test-timing.go
      - name: Coverage report
        if: runner.os != 'Windows'
        run: |
          COVERAGE_REPORT=$(go tool cover -func=coverage.out)
          printf '%s\n' "$COVERAGE_REPORT" | tail -1
      - name: Coverage threshold
        if: runner.os != 'Windows'
        run: |
          COVERAGE_REPORT=$(go tool cover -func=coverage.out)
          COVERAGE=$(printf '%s\n' "$COVERAGE_REPORT" | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          if [ -z "$COVERAGE" ]; then
            echo "::error::Failed to parse total coverage from go tool cover output"
            exit 1
          fi
          echo "Total coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 80" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below 80% threshold"
            exit 1
          fi
      - name: Check coverage wiki
        if: runner.os != 'Windows' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: coverage_wiki
        run: |
          if git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.wiki" HEAD >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping coverage badge because ${GITHUB_REPOSITORY}.wiki is not enabled"
          fi
      - name: Coverage badge
        if: runner.os != 'Windows' && github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.coverage_wiki.outputs.exists == 'true'
        continue-on-error: true
        # v0
        uses: ncruces/go-coverage-report@dfc237255099f2d25066babde51253992175e365
        with:
          coverage-file: coverage.out
          report: true
          chart: true
          amend: true

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # main
        with:
          extra_args: --only-verified

  # Fast layer of the dependency-vulnerability gate: scans go.mod/go.sum against
  # the OSV database on every PR and push. Fails the build on any known, fixable
  # vuln so a security fix lands with the change that introduces (or fails to
  # bump past) it — not weeks later. govulncheck (in the `test` job) stays as the
  # reachability-aware Go signal; osv-scanner is broader — it flags vulnerable
  # deps even when no reachable call path exists. Accepted/unfixable vulns are
  # time-boxed in .github/osv-scanner.toml. The release.yml `security-gate` job
  # is the backstop. (Docker base-image CVEs need a separate trivy scan; follow-up.)
  osv-scan:
    name: OSV vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan Go dependencies against OSV
        # v2.3.8
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67
        with:
          # --no-call-analysis=all: gate on the dependency manifest only, never
          # the embedded govulncheck source pass. That pass runs inside the
          # osv-scanner action's container against ITS bundled Go toolchain; if
          # that Go is older than this repo's go.mod requirement it cannot build,
          # fails, and then reports every stdlib advisory as a spurious finding
          # (it red-failed CI exactly this way). Manifest-only is deterministic
          # and matches Dependabot semantics (flag a vulnerable dependency
          # version whether or not it is reachable). Reachability stays covered
          # by the govulncheck step in the `test` job, on the correct toolchain.
          scan-args: |-
            --config=.github/osv-scanner.toml
            --no-call-analysis=all
            --recursive
            ./

  # Static application security testing. gosec runs unfiltered over ./... — no
  # -severity and no -exclude, so nothing is hidden from the report. The gate
  # then fails the build on every HIGH or MEDIUM finding. Narrow inline #nosec
  # annotations require a rule and written reason beside the exact operation;
  # the committed baseline is empty. LOW findings remain visible in the report.
  # Version is pinned for the same supply-chain reason as staticcheck and so a
  # scanner upgrade and its finding-set changes are reviewed explicitly.
  gosec:
    name: gosec (zero HIGH/MEDIUM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - name: Self-test the gate
        run: .github/scripts/gosec-gate_test.sh
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
      - name: Run gosec
        # gosec exits non-zero whenever it finds anything, which under `set -e`
        # would end the step before the gate ever reads the report. The gate
        # decides pass/fail, so retain the scanner report for each shipped OS.
        # A sentinel makes a missing report fail closed instead of reusing an
        # earlier file.
        run: |
          mkdir -p bin
          for target_os in darwin linux windows; do
            next="bin/gosec-report.${target_os}.next.json"
            report="bin/gosec-report.${target_os}.json"
            printf '%s\n' '{"Issues":[],"Golang errors":{"scan-incomplete":[{"error":"gosec produced no report"}]},"Stats":{"found":0}}' > "$next"
            if GOOS="$target_os" gosec -quiet -fmt json -out "$next" ./...; then
              printf '%s\n' '{"Issues":[],"Golang errors":{},"Stats":{"found":0}}' > "$next"
            fi
            test -s "$next"
            mv "$next" "$report"
          done
      - name: Gate on HIGH and MEDIUM findings for every target OS
        run: |
          for target_os in darwin linux windows; do
            echo "gosec platform: ${target_os}"
            .github/scripts/gosec-gate.sh "bin/gosec-report.${target_os}.json"
          done
      - name: Upload gosec report
        if: always()
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gosec-report
          path: bin/gosec-report.*.json
          if-no-files-found: warn

  release:
    needs: test
    runs-on: ubuntu-latest
    # Disabled: the canonical release pipeline lives in release.yml (macOS
    # codesign + cosign + Formula sync + docker + npm + mcp-registry). Running
    # goreleaser here too raced release.yml to create the same GitHub release.
    if: ${{ github.repository == 'MikkoParkkola/trvl-disabled' }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      # Register QEMU user-static interpreters so buildx can emit
      # linux/arm64 images on the amd64 GitHub-hosted runner.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # goreleaser-action defaults GOTOOLCHAIN=local, which blocks the Go
          # toolchain auto-download in the before-hooks. go.mod requires
          # >= 1.26.6 (stdlib patch for GO-2026-6218 and related advisories)
          # but GitHub runners may still ship an older 1.26.x, so pin the
          # toolchain so go fetches 1.26.6 for the hooks and the release build.
          GOTOOLCHAIN: "go1.26.6"

  npm-publish:
    needs: release
    runs-on: ubuntu-latest
    # Disabled: npm is published by the canonical release.yml pipeline.
    if: ${{ github.repository == 'MikkoParkkola/trvl-disabled' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Update npm package version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          cd npm
          npm version "$VERSION" --no-git-tag-version --allow-same-version
      - name: Publish to npm
        run: npm publish --access public
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
