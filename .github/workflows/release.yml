# Release workflow — fires on v* tag push.
#
# Runs GoReleaser on macOS so the Darwin builds can be adhoc-codesigned with a
# proper bundle identifier (Go's default linker-sign stamps Identifier=a.out,
# which combined with com.apple.quarantine causes Gatekeeper to SIGKILL the
# binary with exit code 137 on end-user Macs).
#
# Optional secrets:
#   HOMEBREW_TAP_TOKEN — PAT with `contents: write` on
#     MikkoParkkola/homebrew-tap, enabling goreleaser's `homebrew_casks` block
#     to auto-bump the cask. Formula freshness is enforced in homebrew-tap.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write  # cosign keyless signing via Sigstore needs OIDC token

jobs:
  # Release backstop for the dependency-vulnerability gate. ci.yaml scans on
  # every PR/push; this re-scans at tag time so a vuln that landed between the
  # last green CI run and the release tag (or via a path that skipped CI) cannot
  # ship. Every publishing job below is transitively `needs:`-ed to goreleaser,
  # which `needs:` this gate — so GitHub release, Homebrew, Docker, npm, and the
  # MCP registry all block if a known fixable vuln is present. Exceptions are
  # time-boxed in .github/osv-scanner.toml.
  security-gate:
    name: Security gate (block release on known vulns)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Scan Go dependencies against OSV
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          # --no-call-analysis=all: manifest-only gate, deterministic regardless
          # of the scanner container's bundled Go toolchain (see ci.yaml osv-scan).
          scan-args: |-
            --config=.github/osv-scanner.toml
            --no-call-analysis=all
            --recursive
            ./

  goreleaser:
    needs: security-gate
    runs-on: macos-14
    env:
      HAS_HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # Must satisfy go.mod (>= 1.26.4 for stdlib CVE fixes); goreleaser
          # resolves the module path with GOTOOLCHAIN=local, so the runner's Go
          # itself has to be 1.26.4, not just the build toolchain.
          go-version: "1.26.4"

      # Install cosign for hybrid release signing — see signs: block in
      # .goreleaser.yaml. Keyless mode uses the workflow's OIDC token
      # against Sigstore's Fulcio, no extra secrets needed.
      #
      # Pin to v2.2.4: this is the cosign version the release signing path has
      # already proven with .goreleaser.yaml's signs: block. GoReleaser Action
      # v7.2.2 still verifies the downloaded GoReleaser checksum, and its
      # optional cosign verification skips older incompatible GoReleaser
      # signatures instead of failing the download path.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.2.4'

      # Smoke-test the packaged binary BEFORE the release pipeline publishes it
      # (issue #203 / AC RELEASE.FIX.2 + Fail-fast). v1.11.0 shipped a release
      # whose binaries were reported non-functional (silent, zero output) and
      # the homebrew_casks step pushed the broken build to the tap before anyone
      # could run it. These steps build the exact host-arch binary GoReleaser
      # produces (same .goreleaser.yaml builds: block, including the darwin
      # codesign post-hook), execute it, and assert:
      #   1. `trvl version` prints a non-empty version string (binary actually
      #      runs and the command tree is compiled in), and
      #   2. an invalid command exits non-zero (cobra error path is wired up).
      # A binary that silently exits 0 with no output — or is SIGKILLed (137) —
      # fails BOTH assertions, so it fails the job here and is never published.
      # --single-target + --snapshot keeps it fast and skips archives/signs.
      - name: Build snapshot binary for smoke test
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --single-target --snapshot --clean
        env:
          GOTOOLCHAIN: "go1.26.4"

      - name: Smoke-test packaged binary (gate release on a working CLI)
        run: |
          set -euo pipefail
          BIN="$(find dist -type f -name trvl -path '*darwin*' | head -n1)"
          if [ -z "${BIN}" ]; then
            echo "::error::smoke test could not locate the built darwin trvl binary under dist/"
            exit 1
          fi
          echo "Smoke-testing ${BIN}"

          # Check 1: `trvl version` must print a non-empty version line and exit 0.
          set +e
          VERSION_OUT="$("${BIN}" version 2>&1)"; VERSION_CODE=$?
          set -e
          echo "version stdout: [${VERSION_OUT}] (exit ${VERSION_CODE})"
          if [ "${VERSION_CODE}" -ne 0 ]; then
            echo "::error::trvl version exited ${VERSION_CODE} (expected 0) — binary is non-functional"
            exit 1
          fi
          if ! printf '%s' "${VERSION_OUT}" | grep -qi 'trvl'; then
            echo "::error::trvl version produced no recognizable output — silent/non-functional binary (the #203 defect)"
            exit 1
          fi

          # Check 2: an invalid command must error to stderr and exit non-zero.
          set +e
          BAD_OUT="$("${BIN}" definitelynotacommand 2>&1)"; BAD_CODE=$?
          set -e
          echo "invalid-cmd stdout: [${BAD_OUT}] (exit ${BAD_CODE})"
          if [ "${BAD_CODE}" -eq 0 ]; then
            echo "::error::invalid command exited 0 — cobra command tree not wired in (the #203 silent-exit-0 defect)"
            exit 1
          fi

          echo "Smoke test PASSED: version prints, invalid command errors non-zero."

      # Re-clean dist/ so the snapshot artifacts above don't collide with the
      # real release build below (goreleaser release also runs --clean, but be
      # explicit so a stale snapshot binary can never be archived/published).
      #
      # The smoke-test `goreleaser build` above runs .goreleaser.yaml before.hooks
      # (go mod tidy + a sed that bumps npm/package.json to the tag version). That
      # leaves the working tree dirty, and `goreleaser release` validates git state
      # at startup and aborts with "git is in a dirty state" (it tolerates its OWN
      # before-hooks dirtying the tree, but not a pre-existing dirty tree). So
      # restore all tracked files to HEAD before the real release runs. dist/ is
      # gitignored and removed separately; no local commits exist to lose (HEAD is
      # the tag), so `git checkout -- .` is safe and surgical.
      - name: Reset working tree before release build
        run: |
          rm -rf dist
          git checkout -- .
          echo "git status after reset:"
          git status --porcelain

      - name: Run GoReleaser with Homebrew tap
        if: env.HAS_HOMEBREW_TAP_TOKEN == 'true'
        # Pin to v7.2.2: action.yml runs on Node 24, avoiding the Node 20
        # forced-runtime annotation from v6.4.0. The action still verifies the
        # downloaded GoReleaser checksum before executing it; release artifact
        # signing stays controlled by the cosign install above and the signs:
        # block in .goreleaser.yaml.
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: "~> v2"
          # Docker is published by the Linux docker job below. Homebrew is
          # published here when HOMEBREW_TAP_TOKEN can push to the tap repo.
          args: release --clean --skip=docker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Hybrid PQC signing: ML-DSA-65 private key. Pubkey is embedded
          # in trvl at build time from internal/selfupdate/keys/. Fingerprint
          # of the active trust anchor is shown by `trvl version --verify`.
          TRVL_MLDSA_PRIVKEY_V1: ${{ secrets.TRVL_MLDSA_PRIVKEY_V1 }}

      - name: Run GoReleaser without Homebrew tap
        if: env.HAS_HOMEBREW_TAP_TOKEN != 'true'
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=docker --skip=homebrew
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRVL_MLDSA_PRIVKEY_V1: ${{ secrets.TRVL_MLDSA_PRIVKEY_V1 }}

  docker:
    runs-on: ubuntu-latest
    needs: goreleaser
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      # Expose ACTIONS_CACHE_URL + ACTIONS_RUNTIME_TOKEN to the raw `docker buildx
      # build` run: steps below. Without this, `--cache-to type=gha` in a run:
      # step is a silent no-op (those vars are only auto-injected into uses:
      # action steps, not run: shells). This makes the gha layer cache actually
      # populate/reuse.
      - name: Expose GitHub Actions cache to buildx
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # Build a single-arch (amd64) image first and load it locally so trivy can
      # scan the actual release artifact's layers. This is the Docker half of the
      # vulnerability gate — the osv-scanner gates the Go deps; trivy gates the
      # base-image OS/library CVEs. Only push (multi-arch) if the scan is clean.
      - name: Build amd64 image for vulnerability scan
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          start="$(date -u +%s)"
          echo "Docker scan image build started at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          docker buildx build \
            --progress=plain \
            --platform linux/amd64 \
            --build-arg VERSION="${VERSION}" \
            --tag "ghcr.io/mikkoparkkola/trvl:scan" \
            --file Dockerfile.release \
            --cache-from type=gha \
            --cache-to type=gha,mode=max,ignore-error=true \
            --load \
            .
          end="$(date -u +%s)"
          echo "Docker scan image build finished in $((end - start)) seconds"

      - name: Trivy image scan (block push on fixable HIGH/CRITICAL CVEs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "ghcr.io/mikkoparkkola/trvl:scan"
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Build and push multi-arch image
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          start="$(date -u +%s)"
          echo "Docker multi-arch build/push started at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          docker buildx build \
            --progress=plain \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="${VERSION}" \
            --tag "ghcr.io/mikkoparkkola/trvl:${VERSION}" \
            --tag "ghcr.io/mikkoparkkola/trvl:latest" \
            --file Dockerfile.release \
            --cache-from type=gha \
            --cache-to type=gha,mode=max,ignore-error=true \
            --push \
            .
          end="$(date -u +%s)"
          echo "Docker multi-arch build/push finished in $((end - start)) seconds"

  mcp-registry:
    runs-on: ubuntu-latest
    needs: [docker, npm]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Stamp server.json for release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "${VERSION}" '
            .version = $v |
            .packages[0].identifier = "ghcr.io/mikkoparkkola/trvl:" + $v |
            del(.packages[0].version) |
            (.packages[] | select(.registryType=="npm") | .version) = $v
          ' server.json > server.tmp
          mv server.tmp server.json

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: |
          # Idempotent: the MCP registry rejects re-publishing the same version
          # with a "duplicate version" 400. On a re-cut of an already-published
          # tag that is success, not failure — don't fail the release run.
          set +e
          out="$(./mcp-publisher publish 2>&1)"
          code=$?
          echo "$out"
          if [ "$code" -ne 0 ]; then
            if echo "$out" | grep -qi "duplicate version"; then
              echo "::notice::MCP registry already has this version — treating as published."
              exit 0
            fi
            exit "$code"
          fi

  # Publishes the trvl-mcp npm wrapper via npm Trusted Publishing (OIDC) — no
  # stored token. One-time npmjs.com setup required: package trvl-mcp ->
  # Settings -> Trusted Publisher -> GitHub Actions, repo MikkoParkkola/trvl,
  # workflow release.yml, environment (none). Until that's configured this job
  # fails loudly, but the GitHub release itself is already published by the
  # goreleaser job above, so the release is not blocked.
  npm:
    runs-on: ubuntu-latest
    needs: goreleaser
    permissions:
      contents: read
      id-token: write  # OIDC token for npm trusted publishing + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # OIDC trusted publishing needs npm >= 11.5.1. Node 24 bundles a recent
      # npm; using setup-node avoids the permission error from globally
      # reinstalling npm on the runner.
      - name: Set up Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Stamp version from tag and publish (OIDC, no token)
        working-directory: npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "${VERSION}" --no-git-tag-version --allow-same-version
          npm publish --provenance --access public
