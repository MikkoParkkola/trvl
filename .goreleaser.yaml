version: 2

project_name: trvl

before:
  hooks:
    # goreleaser-action forces GOTOOLCHAIN=local; wrap each go hook in sh so we
    # can set GOTOOLCHAIN=go1.26.5 (go.mod requires >= 1.26.5 for the stdlib CVE
    # fixes) instead of failing on a runner that still ships 1.26.3. before.hooks
    # must be strings in goreleaser v2, so the env cannot be a map here.
    - sh -c "GOTOOLCHAIN=go1.26.5 go mod tidy"
    - sh -c "GOTOOLCHAIN=go1.26.5 go vet ./..."
    - sh -c "GOTOOLCHAIN=go1.26.5 go test -short ./..."
    # Sync npm/package.json version with the release tag before archives are
    # built. Previously lived under a top-level `after:` block which is not a
    # valid key in goreleaser v2 and made `goreleaser check` fail. Running it
    # in `before.hooks` is equivalent for our needs (version bump ships inside
    # the npm package when published; the Go binary version comes from
    # ldflags, not this file).
    - >-
        sh -c "cd npm && sed -i.bak 's/\"version\": \".*\"/\"version\": \"{{ .Version }}\"/' package.json && rm -f package.json.bak"

builds:
  - id: trvl
    main: ./cmd/trvl
    binary: trvl
    env:
      - CGO_ENABLED=0
      # Build with the patched Go 1.26.5 stdlib (overrides the action's local).
      - GOTOOLCHAIN=go1.26.5
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}} -X github.com/MikkoParkkola/trvl/mcp.serverVersion={{.Version}}
    # Re-sign darwin binaries with a proper bundle identifier. Go's default
    # linker adhoc-sign stamps Identifier=a.out which Gatekeeper rejects with
    # SIGKILL (exit 137) once Homebrew applies com.apple.quarantine. This
    # replaces the identifier while keeping the adhoc (ad-hoc) signature — no
    # Apple Developer ID or notarization required. The hook only runs on
    # darwin artifacts because codesign is a darwin-only binary; Linux and
    # Windows build hosts never reach this path during `goreleaser release`
    # executed from macOS-14 runners.
    #
    # IMPORTANT: do NOT add `-o runtime` (hardened runtime) here. An ad-hoc
    # signature can never pass Gatekeeper for distribution anyway (that needs
    # a Developer ID cert + notarization), so hardened runtime buys zero trust
    # — but it makes a quarantined launch a hard SIGKILL (exit 137, ZERO
    # output) instead of the softer, user-bypassable Gatekeeper path. That
    # silent-kill-on-quarantine is exactly the #203 "non-functional release
    # binary" symptom. Keep the identifier fix; drop hardened runtime.
    hooks:
      post:
        - cmd: sh -c 'if [ "{{ .Os }}" = "darwin" ]; then codesign -s - -i com.mikkoparkkola.trvl -f "{{ .Path }}"; fi'

archives:
  - id: trvl
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# Hybrid quantum-safe release signing (NIST SP 800-208 transition pattern).
# Each archive is signed twice:
#
#   1. cosign keyless (ECDSA-P256 via Sigstore + GitHub OIDC). No persisted
#      signing key — Fulcio mints a short-lived cert tied to the workflow
#      identity at sign time. Defends against compromised release uploads
#      under classical cryptanalysis. Bundle file: <archive>.cosign.bundle.
#
#   2. ML-DSA-65 (NIST FIPS 204) via cmd/sign-mldsa. Long-lived keypair;
#      pubkey embedded in trvl at internal/selfupdate/keys/, privkey in
#      GH Secret TRVL_MLDSA_PRIVKEY_V1 with 1Password backup. Defends
#      against future quantum-cryptanalysis of layer 1. Sig file:
#      <archive>.mldsa65.sig.
#
# Verification (in trvl auto-update path): SHA-256 vs checksums.txt, then
# cosign verify-blob against the workflow identity, then ML-DSA verify
# against the embedded trust anchor. ALL THREE must pass before binary
# replacement. See internal/selfupdate/verify_mldsa.go for the verifier.
#
# Local snapshot builds (`goreleaser release --snapshot`) skip signs by
# default — only `goreleaser release` (tag-driven, in CI) runs them.
signs:
  - id: cosign-keyless
    cmd: cosign
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "--yes"
      - "${artifact}"
    artifacts: archive
    signature: "${artifact}.cosign.bundle"
    output: true
  - id: mldsa65
    cmd: go
    args:
      - "run"
      - "./cmd/sign-mldsa"
      - "--in"
      - "${artifact}"
      - "--out"
      - "${signature}"
    artifacts: archive
    signature: "${artifact}.mldsa65.sig"
    output: true

changelog:
  # Use GitHub's native release-note generation so the auto "## New Contributors"
  # section (crediting first-time external contributors by @handle) is included.
  # goreleaser's default git-based changelog only lists raw commit subjects and
  # silently omits contributor credit — which is how an external contributor's
  # major feature shipped uncredited in v1.7.0 (#142, @marcello-russo). 2026-06-07.
  # NOTE: github-native delegates grouping/filtering to .github/release.yml
  # (sort/filters here are ignored by design).
  use: github-native

release:
  github:
    owner: MikkoParkkola
    name: trvl
  prerelease: auto
  draft: false
  name_template: "v{{ .Version }}"
  header: |
    ## trvl {{ .Version }}

    AI travel agent — 55 MCP tools for flights, hotels, ground transport, price alerts. Free, no API keys.

    ### Install

    ```bash
    # One-liner
    curl -fsSL https://github.com/MikkoParkkola/trvl/releases/download/v{{ .Version }}/trvl_{{ .Version }}_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz | tar xz -C /usr/local/bin trvl

    # Homebrew
    brew install MikkoParkkola/tap/trvl

    # Go
    go install github.com/MikkoParkkola/trvl/cmd/trvl@v{{ .Version }}
    ```

# Publish a Homebrew *Formula* (not a Cask). A CLI binary belongs in a Formula:
# `brew install` of a formula relocates the binary and strips the
# com.apple.quarantine xattr, so the adhoc-signed binary launches cleanly on
# Apple Silicon. A Cask, by contrast, keeps quarantine on the downloaded
# artifact, and Gatekeeper then SIGKILLs the adhoc-signed binary (the trvl#203
# "non-functional release" + the Gatekeeper "Not Opened" popup). Formula-only
# is the zero-cost, zero-popup distribution path until/unless Developer ID
# notarization is wired in (tracked separately).
#
# NOTE: goreleaser v2 marks `brews` deprecated and steers pre-built binaries to
# `homebrew_casks`. That is INTENTIONALLY rejected here: a cask keeps the
# com.apple.quarantine xattr, which Gatekeeper uses to SIGKILL our adhoc-signed
# binary. Do NOT "modernize" this back to homebrew_casks without first wiring
# Developer ID notarization, or you reintroduce the trvl#203 popup. The action is
# pinned to `~> v2`, where `brews` remains functional; release/build never run
# `goreleaser check`, so the deprecation warning does not fail the pipeline.
brews:
  - name: trvl
    ids:
      - trvl
    repository:
      owner: MikkoParkkola
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/MikkoParkkola/trvl
    description: "AI travel agent: flights, hotels and transport via MCP, no API keys"
    license: "PolyForm-Noncommercial-1.0.0"
    test: |
      system "#{bin}/trvl", "version"
    caveats: |
      Run `trvl mcp install` to connect trvl to Claude Desktop, Cursor,
      Windsurf, Codex, VS Code Copilot, Zed, or another MCP client.

# Docker images are published by .github/workflows/release.yml so release CI can
# build multi-arch images with Dockerfile.release, scan them with Trivy, and push
# versioned plus latest tags independently of GoReleaser's deprecated Docker
# pipes.
